limit_req_zone $binary_remote_addr zone=moveinmate_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=moveinmate_agent:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=moveinmate_connections:10m;

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name moveinmate.example.com;

    if ($host != "moveinmate.example.com") {
        return 444;
    }

    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 15s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn moveinmate_connections 8;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location = /api/v1/auth/login {
        limit_req zone=moveinmate_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/v1/auth/reset {
        return 410;
    }

    location = /api/v1/demo/reset {
        return 410;
    }

    location = /api/v1/management/reset {
        limit_req zone=moveinmate_login burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/v1/management/assistant/ {
        limit_req zone=moveinmate_agent burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/v1/agent/form-from-files {
        client_max_body_size 17m;
        limit_req zone=moveinmate_agent burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/v1/agent/chat-with-files {
        client_max_body_size 17m;
        limit_req zone=moveinmate_agent burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/v1/speech/transcribe {
        client_max_body_size 26m;
        limit_req zone=moveinmate_agent burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/v1/vehicles/extract {
        client_max_body_size 6m;
        limit_req zone=moveinmate_agent burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/v1/(requests/vehicle|residents/[^/]+/requests/[^/]+/vehicle)$ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/v1/agent/ {
        limit_req zone=moveinmate_agent burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/v1/speech/ {
        limit_req zone=moveinmate_agent burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
